name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-ci:
    name: Build & Test (Ubuntu / C++26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++-14 \
            cmake \
            ninja-build \
            pkgconf \
            libtbb-dev \
            libboost-all-dev \
            libeigen3-dev \
            git \
            pipx

      # clang-format output is version-sensitive. Pin the exact version used
      # during development (23.1.3) so CI and local checks agree, independent
      # of whichever clang-format the runner image happens to ship.
      - name: Install clang-format (pinned 23.1.3)
        run: |
          pipx install "clang-format==23.1.3"
          export PATH="$HOME/.local/bin:$PATH"
          clang-format --version

      - name: Verify Code Formatting (clang-format)
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          CHECK_DIRS=()
          for d in src examples tests; do
            [ -d "$d" ] && CHECK_DIRS+=("$d")
          done

          if [ ${#CHECK_DIRS[@]} -gt 0 ]; then
            find "${CHECK_DIRS[@]}" -type f \( -name "*.cpp" -o -name "*.hpp" \) -print0 \
              | xargs -0 -r clang-format --dry-run -Werror
          fi

      # GCC 13 (the ubuntu-latest default) does not accept -std=c++26, so the
      # build explicitly selects g++-14.
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMYSLAM_BUILD_TESTS=ON \
            -DMYSLAM_BUILD_EXAMPLES=ON

      - name: Build All Targets
        run: cmake --build build -j$(nproc)

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure --schedule-random
